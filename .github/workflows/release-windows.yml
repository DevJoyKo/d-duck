name: Release (Windows preview)

# windows-support 5.4. Builds the unsigned Windows x64 NSIS installer from a tag, with no restored caches, locked
# dependencies (`npm ci`, `cargo --locked`), a build-provenance attestation and a SHA256 file. A tag push only builds
# and keeps the files as a workflow artifact. Attaching them to the GitHub release happens only from a manual run with
# `attach: true` (the user's approval), and only for an existing release of that tag. PR artifacts are never used.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build (e.g. v0.1.3)"
        required: true
      attach:
        description: "Attach the installer and checksum to that release"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-windows-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build NSIS installer (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
      attestations: write
    defaults:
      run:
        working-directory: app
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: stable
      # No cache restore on purpose: a release is built from the tag's sources and the locked registries only.
      - run: npm ci
      - run: npx tauri build --ci -- --locked
      - name: SHA256
        run: |
          cd target/release/bundle/nsis
          sha256sum ./*-setup.exe | sed 's# \./#  #' > SHA256SUMS-windows.txt
          cat SHA256SUMS-windows.txt
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: app/target/release/bundle/nsis/*-setup.exe
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dduck-windows-release
          path: |
            app/target/release/bundle/nsis/*-setup.exe
            app/target/release/bundle/nsis/SHA256SUMS-windows.txt
          retention-days: 30

  attach:
    name: Attach to the release (manual approval)
    needs: build
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.attach == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: dduck-windows-release
          path: out
      - name: Upload to the existing release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag }}
        run: gh release upload "$TAG" out/* --repo "$GITHUB_REPOSITORY"
