name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Every PR into main must pass on both Mac architectures before it can merge (branch protection requires the two
# "Test and lint (macOS …)" checks). UI and Rust run as separate jobs so each architecture finishes in the time of
# the slower half, not the sum; the gate job at the end keeps the required check names.
jobs:
  ui:
    name: UI (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            runner: macos-15
          - name: macOS Intel
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Exact version on both runners: ICU data changes between patch releases (e.g. Korean 오후 vs PM).
          node-version: 22.23.4

      # node_modules keyed on the lock file, the runner and the Node version: a hit skips `npm ci` entirely.
      - id: modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: app/node_modules
          key: modules-${{ matrix.runner }}-node22.23.4-${{ hashFiles('app/package-lock.json') }}
      - if: steps.modules.outputs.cache-hit != 'true'
        run: npm ci

      - run: npx tsc --noEmit -p .
      - run: npx vitest run
      - run: npm run lint
      - run: npx vite build

  rust:
    name: Rust (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            runner: macos-15
          - name: macOS Intel
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.4

      - id: modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: app/node_modules
          key: modules-${{ matrix.runner }}-node22.23.4-${{ hashFiles('app/package-lock.json') }}
      - if: steps.modules.outputs.cache-hit != 'true'
        run: npm ci
      # The Tauri shell embeds ../dist at compile time, so clippy on the workspace needs the built UI.
      - run: npx vite build

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: stable
          components: clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: app
          key: ${{ matrix.runner }}

      # Test fixtures are generated by python3 (preinstalled on the runner) on first use.
      - run: cargo test -p dduck-core
      # Covers the whole workspace, including the Tauri shell (package `dduck`) in check mode, so no separate
      # `cargo check -p dduck` or full Tauri build is needed. Every target is linted and any warning fails the build.
      - run: cargo clippy --workspace --all-targets -- -D warnings

  gate:
    # The required check names. `needs` sees a matrix job as one result, so each gate passes only when UI and Rust
    # passed on both architectures; the per-architecture detail is in the UI/Rust job names.
    name: Test and lint (${{ matrix.name }})
    needs: [ui, rust]
    if: always()
    strategy:
      matrix:
        name: [macOS Apple Silicon, macOS Intel]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Both halves passed
        env:
          UI: ${{ needs.ui.result }}
          RUST: ${{ needs.rust.result }}
        run: |
          echo "ui=$UI rust=$RUST"
          test "$UI" = success && test "$RUST" = success
