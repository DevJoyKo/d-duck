name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Test and lint (macOS)
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: stable
          components: clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: app

      # UI
      - run: npm ci
      - run: npx tsc --noEmit -p .
      - run: npx vitest run
      - run: npm run lint
      # The Tauri shell embeds ../dist at compile time, so build the UI before checking it.
      - run: npx vite build

      # Rust. Test fixtures are generated by python3 (preinstalled on the runner) on first use.
      - run: cargo test -p dduck-core
      # Covers the whole workspace, including the Tauri shell (package `dduck`) in check mode,
      # so no separate `cargo check -p dduck` or full Tauri build is needed. Every target
      # (lib, bins, tests, examples) is linted and any warning fails the build.
      - run: cargo clippy --workspace --all-targets -- -D warnings
